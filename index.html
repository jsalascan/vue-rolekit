<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tema elegido en el footer: se aplica antes de pintar para que no parpadee.
         Misma clave y valores que src/docs/theme.ts. -->
    <script>
      try {
        var tema = localStorage.getItem('rk-theme')
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema
      } catch (e) {}
    </script>

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://jsalascan.github.io/vue-rolekit/og-image.png" />
    <meta property="og:locale" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jsalascan.github.io/vue-rolekit/og-image.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
