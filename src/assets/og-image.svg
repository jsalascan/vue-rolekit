<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f5efe6"/>
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="none" stroke="#dfd1bc" stroke-width="4"/>

  <!-- eyebrow -->
  <text x="92" y="132" font-family="ProFontWindows" font-weight="700" font-size="30" fill="#ff8400">02</text>
  <text x="138" y="132" font-family="ProFontWindows" font-weight="700" font-size="30" fill="#5f5646">// VUE-ROLEKIT</text>
  <text x="428" y="132" font-family="ProFontWindows" font-weight="700" font-size="30" fill="#ff8400">&#10033;</text>

  <!-- titulo -->
  <text x="86" y="280" font-family="ProFontWindows" font-weight="700" font-size="110" letter-spacing="-2" fill="#2d2a24">vue-</text>
  <text x="86" y="410" font-family="ProFontWindows" font-weight="700" font-size="110" letter-spacing="-2" fill="#2d2a24">rolekit</text>

  <!-- banner recto -->
  <rect x="86" y="440" width="560" height="56" fill="#263c70" stroke="#f5efe6" stroke-width="6"/>
  <text x="366" y="478" font-family="ProFontWindows" font-weight="700" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="1">COMPONENTES VUE 3 &#183; ESTILO PROPIO</text>

  <!-- url -->
  <text x="92" y="566" font-family="ProFontWindows" font-weight="700" font-size="24" fill="#5f5646">github.com/jsalascan/vue-rolekit</text>

  <!-- swatches de componentes -->

  <!-- botón -->
  <g transform="rotate(-6 900 200)">
    <rect x="780" y="170" width="260" height="80" rx="40" fill="#dfd1bc"/>
    <rect x="770" y="160" width="260" height="80" rx="40" fill="#ff8400"/>
    <rect x="820" y="192" width="160" height="16" rx="8" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- checkbox -->
  <g transform="rotate(8 1005 335)">
    <rect x="960" y="290" width="110" height="110" rx="20" fill="#dfd1bc"/>
    <rect x="950" y="280" width="110" height="110" rx="20" fill="#263c70" stroke="#2d2a24" stroke-width="3"/>
    <path d="M978 336 L998 356 L1034 312" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- switch -->
  <g transform="rotate(-4 835 375)">
    <rect x="770" y="350" width="150" height="70" rx="35" fill="#dfd1bc"/>
    <rect x="760" y="340" width="150" height="70" rx="35" fill="#f1e5d5" stroke="#2d2a24" stroke-width="3"/>
    <circle cx="860" cy="375" r="25" fill="#ff8400"/>
  </g>

  <!-- badge -->
  <g transform="rotate(6 1035 458)">
    <rect x="950" y="440" width="190" height="56" rx="28" fill="#dfd1bc"/>
    <rect x="940" y="430" width="190" height="56" rx="28" fill="#f1e5d5" stroke="#2d2a24" stroke-width="3"/>
    <circle cx="972" cy="458" r="7" fill="#2f7a4d"/>
    <rect x="992" y="450" width="110" height="16" rx="8" fill="#2d2a24" opacity="0.55"/>
  </g>
</svg>
